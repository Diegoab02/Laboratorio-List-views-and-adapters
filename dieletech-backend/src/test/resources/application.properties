# ==========================================
# Configuracion para TESTS (H2 en memoria)
# ==========================================

spring.application.name=backend-test

# H2 en memoria — no necesita MySQL corriendo
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA — crea tablas automaticamente en H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT (valores de test)
jwt.secret=test_secret_key_muy_larga_para_tests_automatizados_2024_ok
jwt.expiration=86400000

# Desactivar envio real de correos
spring.mail.host=localhost
spring.mail.port=2525

# URL dummy
app.url=http://localhost:5173

# Auto-verify desactivado para probar flujo completo
app.auto-verify=false

# Puerto
server.port=0

# Mensajes de error
server.error.include-message=always
app.quiz.passing-score=70
app.certificate.issuer=Dieletech
